# Optional pipeline mounts.  Include with:
#   docker compose -f compose.yaml -f compose.optional.yaml up
#
# All four mounts are optional.  The pipeline does not always run every
# process stage, so unused mounts can be omitted entirely.
#
#   EXTCAT_INPUT  - raw external catalog input (process_extcat)
#   REARR_OUTPUT  - rearranged shear catalog output (process_rearr)
#   EXPOLIST_DIR  - rearranged exposure-list directory (process_rearr)
#   FD_OUTPUT     - field-distortion output (process_fd)
#
# When a mount is not included, the pipeline falls back to defaults that
# live under PROCESS_DATA (already writable), or the process stage is
# simply not run.

services:
  FourierQuad-CPP:
    volumes:
      - type: bind
        source: ${EXTCAT_INPUT_HOST}
        target: ${EXTCAT_INPUT_CONTAINER:-/data/catalogs/ExtCatInput}
        read_only: true
      - type: bind
        source: ${REARR_OUTPUT_HOST}
        target: ${REARR_OUTPUT_CONTAINER:-/data/output/rearr}
      - type: bind
        source: ${EXPOLIST_DIR_HOST}
        target: ${EXPOLIST_DIR_CONTAINER:-/data/output/expolist}
      - type: bind
        source: ${FD_OUTPUT_HOST}
        target: ${FD_OUTPUT_CONTAINER:-/data/output/fdout}
    environment:
      EXTCAT_INPUT_CONTAINER: ${EXTCAT_INPUT_CONTAINER:-/data/catalogs/ExtCatInput}
      REARR_OUTPUT_CONTAINER: ${REARR_OUTPUT_CONTAINER:-/data/output/rearr}
      EXPOLIST_DIR_CONTAINER: ${EXPOLIST_DIR_CONTAINER:-/data/output/expolist}
      FD_OUTPUT_CONTAINER: ${FD_OUTPUT_CONTAINER:-/data/output/fdout}
