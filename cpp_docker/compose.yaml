services:
  FourierQuad-CPP:
    image: ${IMAGE_NAME:-cpppipeline-dev:gxx12.3-openmpi4.1.8-pmi2}
    platform: linux/amd64
    build:
      context: .
      target: runtime
      args:
        BUILD_JOBS: ${BUILD_JOBS:-4}
        CPP_UID: ${HOST_UID:-1000}
        CPP_GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace/src_pipe
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${CPP_SOURCE_HOST}
        target: /workspace/src_pipe
      - type: bind
        source: ${SCIENCE_ROOT_HOST}
        target: ${SCIENCE_ROOT_CONTAINER:-/data/archive/science}
        read_only: true
      - type: bind
        source: ${DQ_ROOT_HOST}
        target: ${DQ_ROOT_CONTAINER:-/data/archive/dqmask}
        read_only: true
      - type: bind
        source: ${ASTROMETRY_CAT_HOST}
        target: ${ASTROMETRY_CAT_CONTAINER:-/data/catalogs/AstroDir}
        read_only: true
      - type: bind
        source: ${SOURCE_CAT_HOST}
        target: ${SOURCE_CAT_CONTAINER:-/data/catalogs/ExtSrcDir}
        read_only: true
      - type: bind
        source: ${FLAT_PATH_HOST}
        target: ${FLAT_PATH_CONTAINER:-/data/calib/FlatDir}
        read_only: true
      - type: bind
        source: ${PROCESS_DATA_HOST}
        target: ${PROCESS_DATA_CONTAINER:-/data/DataProcess}
      - type: bind
        source: ${EXTCAT_INPUT_HOST}
        target: ${EXTCAT_INPUT_CONTAINER:-/data/catalogs/ExtCatInput}
        read_only: true
      - type: bind
        source: ${REARR_OUTPUT_HOST}
        target: ${REARR_OUTPUT_CONTAINER:-/data/output/rearr}
      - type: bind
        source: ${EXPOLIST_DIR_HOST}
        target: ${EXPOLIST_DIR_CONTAINER:-/data/output/expolist}
      - type: bind
        source: ${FD_OUTPUT_HOST}
        target: ${FD_OUTPUT_CONTAINER:-/data/output/fdout}
    environment:
      SCIENCE_ROOT_CONTAINER: ${SCIENCE_ROOT_CONTAINER:-/data/archive/science}
      DQ_ROOT_CONTAINER: ${DQ_ROOT_CONTAINER:-/data/archive/dqmask}
      PROCESS_DATA_CONTAINER: ${PROCESS_DATA_CONTAINER:-/data/DataProcess}
      EXTCAT_INPUT_CONTAINER: ${EXTCAT_INPUT_CONTAINER:-/data/catalogs/ExtCatInput}
      REARR_OUTPUT_CONTAINER: ${REARR_OUTPUT_CONTAINER:-/data/output/rearr}
      EXPOLIST_DIR_CONTAINER: ${EXPOLIST_DIR_CONTAINER:-/data/output/expolist}
      FD_OUTPUT_CONTAINER: ${FD_OUTPUT_CONTAINER:-/data/output/fdout}
