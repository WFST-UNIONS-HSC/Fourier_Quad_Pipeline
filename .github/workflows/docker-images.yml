name: Build and publish Docker images

# ==========================================
# Trigger: push a version tag (v*) or manual dispatch.
# Builds two images and publishes them to GHCR:
#   - f77pipeline  (f77_docker context)
#   - cpppipeline  (cpp_docker context)
# ==========================================
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-f77:
    name: Build f77 image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check public Docker project
        run: bash f77_docker/scripts/check-public-repo.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI labels and tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/f77pipeline
          tags: |
            type=raw,value=gnu4.8.5
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./f77_docker
          file: ./f77_docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_JOBS=4
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-cpp:
    name: Build cpp image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check public Docker project
        run: bash cpp_docker/scripts/check-public-repo.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI labels and tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/cpppipeline
          tags: |
            type=raw,value=gxx12.3-openmpi4.1.8-pmi2
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./cpp_docker
          file: ./cpp_docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_JOBS=4
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
