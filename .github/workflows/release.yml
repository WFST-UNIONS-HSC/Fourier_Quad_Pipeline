name: Publish release

# ==========================================
# Trigger: push a version tag (v*) or manual dispatch.
# Creates a GitHub Release and attaches one zip file per
# top-level content directory in the repository, including
# gen_src_cat.zip for the external-catalog generator.
# ==========================================
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release with zipped directories
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package each content directory
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # Zip every top-level content directory.
          # Exclude CI internals and the artifact staging directory itself.
          find . -maxdepth 1 -mindepth 1 -type d \
              ! -name '.git' \
              ! -name '.planning' \
              ! -name '.github' \
              ! -name 'artifacts' \
              -print0 | sort -z | while IFS= read -r -d '' dir; do
            dirname="$(basename "$dir")"
            echo "Zipping: $dirname"
            zip -r "artifacts/${dirname}.zip" "$dir" \
                -x '*/.git/*' '*/.git'
          done

          # Archive root-level documentation (+ LICENSE) so the per-tree README
          # pointers (../CPP_GUIDE.md, ../CPP_PIPELINE_PARAMETERS.md) resolve
          # when a user extracts a single content zip alongside docs.zip.
          zip artifacts/docs.zip \
              README.md README_CN.md \
              F77_GUIDE.md F77_GUIDE_CN.md \
              CPP_GUIDE.md CPP_GUIDE_CN.md \
              CPP_PIPELINE_PARAMETERS.md LICENSE

          # gen_src_cat is a required standalone release asset.
          test -f artifacts/gen_src_cat.zip

          echo "=== Artifact list ==="
          ls -lh artifacts/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.zip
