name: Publish release

# ==========================================
# Trigger: push a version tag (v*) or manual dispatch.
# Creates a GitHub Release and attaches one zip file per
# top-level content directory in the repository.
# ==========================================
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release with zipped directories
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package each content directory
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # Zip every top-level content directory.
          # Exclude .git, .planning, and .github (CI internals).
          find . -maxdepth 1 -mindepth 1 -type d \
              ! -name '.git' \
              ! -name '.planning' \
              ! -name '.github' \
              -print0 | sort -z | while IFS= read -r -d '' dir; do
            dirname="$(basename "$dir")"
            echo "Zipping: $dirname"
            zip -r "artifacts/${dirname}.zip" "$dir" \
                -x '*/.git/*' '*/.git'
          done

          echo "=== Artifact list ==="
          ls -lh artifacts/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.zip
